site_name: AI Engineering Lab
site_description: Applied curriculum for building LLM-backed features — APIs, RAG, agents, memory, and evaluation.
site_url: https://yuvrxj-afk.github.io/ai-engineering-lab/
repo_url: https://github.com/yuvrxj-afk/ai-engineering-lab
repo_name: yuvrxj-afk/ai-engineering-lab

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Prerequisites: getting-started/prerequisites.md
    - Setup: getting-started/setup.md
  - "Part I \u2014 Foundations":
    - foundations/index.md
    - 1. Model Basics: foundations/01-model-basics.md
    - 2. Prompting: foundations/02-prompting.md
    - 3. Structured Output: foundations/03-structured-output.md
    - 4. Embeddings & Search: foundations/04-embeddings.md
    - 5. RAG & Retrieval Tuning: foundations/05-rag.md
  - "Part II \u2014 Systems":
    - systems/index.md
    - 6. Tool Calling: systems/06-tool-calling.md
    - 7. Agents: systems/07-agents.md
    - 8. Memory: systems/08-memory.md
    - 9. MCP: systems/09-mcp.md
    - 10. Evaluation & Testing: systems/10-evaluation.md
  - "Part III \u2014 Extending the Stack":
    - extending/index.md
    - 11. Open-Source & Local Models: extending/11-open-source.md
    - 12. Multimodal AI: extending/12-multimodal.md
    - 13. Fine-Tuning: extending/13-fine-tuning.md
  - "Part IV \u2014 Production":
    - production/index.md
    - 14. Safety & Guardrails: production/14-safety.md
    - 15. Streaming & Real-Time UX: production/15-streaming.md
    - 16. Observability & LLMOps: production/16-observability.md
    - 17. Caching & Cost: production/17-caching.md
    - 18. Deployment: production/18-deployment.md
  - Study Path: study-path.md
  - Capstone: capstone.md
  - References: references.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: "#"

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuvrxj-afk/ai-engineering-lab
  generator: false
